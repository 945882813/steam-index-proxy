name: One-time PF-V2 Real Forecast Registration 2026-10-20

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-pf-v2-register-20261020.yml'

permissions:
  contents: read

concurrency:
  group: steam-radar-pf-v2-register
  cancel-in-progress: false

jobs:
  register-real-forecasts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Offline regressions
        run: python -m unittest discover -s tests -q
      - name: Preflight all researched candidates from real production snapshots
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets['GOOGLE_SERVICE_ACCOUNT_JSON'] }}
          GOOGLE_SHEET_ID: ${{ secrets['GOOGLE_SHEET_ID'] }}
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from prospective_forecast import (
              connect, read_sheets, sheets_rows, POLICY_VERSION, lock_draft,
              nonnegative_int, aware, CN,
          )
          from blackhorse_eval import collect_ccu, collect_reviews
          assert POLICY_VERSION == "PF-2026-10-V2"
          today = datetime.now(CN).date().isoformat()
          assert today == "2026-10-20", "wrong local day: decline late/backdated forecast lock"
          drafts = [
            {
              "AppID": "2121510",
              "游戏名称": "Tenebris Somnia",
              "观察阶段": "已发行",
              "研究假设": "像素生存恐怖与真人影像切换能否在未来7/30日持续转化为新增官方评论和同源CCU，而非仅首发曝光",
              "证据链接": "https://store.steampowered.com/app/2121510/",
              "玩法创新分": 91, "黑马潜力分": 82,
              "玩家趋势分": 77, "商业热度分": 74,
              "活动干扰核验计划": "审查20%首发折扣、Demo独立AppID、发行商与媒体曝光、版本更新；简中样本低；不把FMV设计热度等同增长"
            },
            {
              "AppID": "3569420",
              "游戏名称": "Chained Beasts",
              "观察阶段": "已发行",
              "研究假设": "铁链约束四人合作能否在未来7/30日形成可持续的评论增长与同源CCU恢复；同时观察简中较低评价的制约",
              "证据链接": "https://store.steampowered.com/app/3569420/",
              "玩法创新分": 93, "黑马潜力分": 80,
              "玩家趋势分": 70, "商业热度分": 74,
              "活动干扰核验计划": "核35%首发折扣至10月29日、10月20日开发者公告和更新、合作传播曝光以及简中/非简中口碑差异"
            },
            {
              "AppID": "4995030",
              "游戏名称": "Folded Fables: Tidy Up The Dragon Hoard",
              "观察阶段": "已发行",
              "研究假设": "纸艺收纳与多人整理循环是否能从小样本过渡到真实7/30日评论增长和同源玩家留存，而非短暂首发兴趣",
              "证据链接": "https://store.steampowered.com/app/4995030/",
              "玩法创新分": 91, "黑马潜力分": 76,
              "玩家趋势分": 65, "商业热度分": 65,
              "活动干扰核验计划": "核10%首发优惠至10月22日、活动曝光、合作模式反馈及无简中支持；原有样本小，须保留证据不足情形"
            },
          ]
          book = connect()
          ledger, posterior = read_sheets(book)
          assert not sheets_rows(ledger), "prospective ledger not empty; no repeat registration"
          assert len(posterior.get_all_values()) == 1, "posterior already populated"
          game_rows = {str(r['AppID']): r for r in book.worksheet("游戏库").get_all_records()}
          ranking_rows = {str(r['AppID']): r for r in book.worksheet("每日排名").get_all_records()
                          if str(r.get('报告日期')) == today}
          cs = collect_ccu(book.worksheet("CCU可信样本").get_all_records(), with_source=True)
          rs = collect_reviews(book.worksheet("评论采样").get_all_records())
          now = datetime.now(timezone.utc)
          target = Path("/tmp/steam-pf-v2-reviewed")
          target.mkdir(parents=True, exist_ok=True)
          for i, draft in enumerate(drafts):
              appid = draft["AppID"]
              game = game_rows.get(appid, {})
              ranking = ranking_rows.get(appid, {})
              assert str(game.get("发行阶段", "")).startswith("0-7d"), f"not confirmed new released game: {appid}"
              assert str(game.get("游戏名称", "")) == draft["游戏名称"], "game-name mismatch"
              assert str(ranking.get("游戏名称", "")) == draft["游戏名称"], "ranking-name mismatch"
              for draft_key, rank_key in (("玩法创新分", "创新分"), ("黑马潜力分", "黑马潜力分"),
                                          ("玩家趋势分", "玩家趋势分"), ("商业热度分", "商业热度分")):
                  assert float(ranking[rank_key]) == float(draft[draft_key]), f"rank score drift: {appid}/{draft_key}"
              row = lock_draft(draft, cs, rs, now)
              assert row[12] == POLICY_VERSION and row[14] and row[17], f"missing source anchor: {appid}"
              assert row[16] in ("Steam Index", "Steam Official"), f"source absent: {appid}"
              assert nonnegative_int(row[15]) >= 20 and nonnegative_int(row[18]) >= 30, f"low base: {appid}"
              ch = (now - aware(row[14])).total_seconds() / 3600
              rh = (now - aware(row[17])).total_seconds() / 3600
              assert 0 <= ch <= 12 and 0 <= rh <= 24, f"expired true sample for {appid}"
              print(f"ELIGIBLE appid={appid} CCU={row[15]} source={row[16]} "
                    f"ccu_time={row[14]} reviews={row[18]} review_time={row[17]} "
                    f"ccu_age_h={ch:.2f} review_age_h={rh:.2f}", flush=True)
              (target / f"candidate-{i+1}.json").write_text(
                  json.dumps(draft, ensure_ascii=False), encoding="utf-8"
              )
          print("ALL_THREE_REAL_PREFLIGHTS_OK; no forecast written by preflight", flush=True)
          PY
      - name: Lock first 3 actual forecasts and immediately verify Sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets['GOOGLE_SERVICE_ACCOUNT_JSON'] }}
          GOOGLE_SHEET_ID: ${{ secrets['GOOGLE_SHEET_ID'] }}
        run: |
          python prospective_forecast.py register --draft-file /tmp/steam-pf-v2-reviewed/candidate-1.json
          python prospective_forecast.py register --draft-file /tmp/steam-pf-v2-reviewed/candidate-2.json
          python prospective_forecast.py register --draft-file /tmp/steam-pf-v2-reviewed/candidate-3.json
          python prospective_forecast.py audit
      - name: Recompute derived only and verify unmatured evidence
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets['GOOGLE_SERVICE_ACCOUNT_JSON'] }}
          GOOGLE_SHEET_ID: ${{ secrets['GOOGLE_SHEET_ID'] }}
        run: |
          python prospective_forecast.py evaluate
          python - <<'PY'
          from prospective_forecast import connect, read_sheets, sheets_rows
          book = connect()
          ledger, posterior = read_sheets(book)
          locked = sheets_rows(ledger)
          rows = posterior.get_all_values()[1:]
          assert len(locked) == 3 and len(rows) == 3
          assert {r[2] for r in locked} == {"2121510", "3569420", "4995030"}
          for p in rows:
              assert p[6] == "WINDOW_NOT_MATURE", f"Unexpected D7 evidence for {p[1]}"
              assert p[11] == "WINDOW_NOT_MATURE", f"Unexpected D30 evidence for {p[1]}"
              assert p[7] == "PENDING" and p[12] == "PENDING"
              assert p[13] == "PENDING_MANUAL_ATTRIBUTION"
              assert any(r[0] == p[0] and r[-1] == p[-1] for r in locked)
          print("THREE_REAL_FORECASTS_AND_POSTERIORS_READBACK_OK", flush=True)
          PY
