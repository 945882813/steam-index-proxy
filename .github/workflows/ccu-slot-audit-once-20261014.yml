name: One-time CCU Slot Audit 2026-10-14
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ccu-slot-audit-once-20261014.yml'
permissions:
  contents: read
  actions: read
jobs:
  audit-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run read-only real GitHub and Sheet slot audit
        run: python ccu_schedule_health.py
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets['GOOGLE_SERVICE_ACCOUNT_JSON'] }}
          GOOGLE_SHEET_ID: ${{ secrets['GOOGLE_SHEET_ID'] }}
