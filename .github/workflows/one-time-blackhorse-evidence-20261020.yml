name: One-time Blackhorse D7 Evidence Verification 2026-10-20

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-blackhorse-evidence-20261020.yml'

permissions:
  contents: read

concurrency:
  group: steam-radar-daily-collection
  cancel-in-progress: false

jobs:
  verify-posterior-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Dependencies
        run: pip install -r requirements.txt
      - name: Offline regression before posterior refresh
        run: python -m unittest discover -s tests -v
      - name: Refresh posterior only from existing Sheet evidence
        run: python blackhorse_eval.py
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets['GOOGLE_SERVICE_ACCOUNT_JSON'] }}
          GOOGLE_SHEET_ID: ${{ secrets['GOOGLE_SHEET_ID'] }}
