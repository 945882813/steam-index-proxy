name: Steam Radar V1.2 - Discovery and Reviews

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'radar_v12.py'
      - '.github/workflows/radar-v12.yml'
  schedule:
    - cron: '20 0 * * *'

permissions:
  contents: read

concurrency:
  group: steam-radar-v12
  cancel-in-progress: false

jobs:
  discover-and-reviews:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Static syntax check
        run: python -m py_compile radar_v12.py sheet_schema.py
      - name: Discover Steam candidates (US and CN)
        id: discovery
        run: python radar_v12.py discover
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets['GOOGLE_SERVICE_ACCOUNT_JSON'] }}
          GOOGLE_SHEET_ID: ${{ secrets['GOOGLE_SHEET_ID'] }}
      - name: Sample comparable Steam reviews and calculate velocity
        id: reviews
        if: ${{ always() }}
        run: python radar_v12.py reviews
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets['GOOGLE_SERVICE_ACCOUNT_JSON'] }}
          GOOGLE_SHEET_ID: ${{ secrets['GOOGLE_SHEET_ID'] }}
      - name: Health check and persist active alerts
        if: ${{ always() }}
        run: python radar_v12.py health
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets['GOOGLE_SERVICE_ACCOUNT_JSON'] }}
          GOOGLE_SHEET_ID: ${{ secrets['GOOGLE_SHEET_ID'] }}
