name: Steam Radar - Early Daily Collection and Recovery

on:
  workflow_dispatch:
  schedule:
    # UTC => Beijing 03:17, 05:47 and 07:17 (each on the next day).
    # GitHub scheduled runs are best effort. Each slot checks Sheets and only
    # recovers missing tasks. Subsequent slots should normally be no-ops.
    - cron: '17 19 * * *'
    - cron: '47 21 * * *'
    - cron: '17 23 * * *'

permissions:
  contents: read

concurrency:
  group: steam-radar-daily-collection
  cancel-in-progress: false

jobs:
  collect-or-recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Offline syntax and tests
        id: offline
        run: |
          python -m py_compile radar_v12.py blackhorse_eval.py daily_recovery.py prospective_forecast.py
          python -m unittest discover -s tests -v
      - name: Selectively collect only missing daily Steam data
        run: python daily_recovery.py
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets['GOOGLE_SERVICE_ACCOUNT_JSON'] }}
          GOOGLE_SHEET_ID: ${{ secrets['GOOGLE_SHEET_ID'] }}

      - name: Incremental prospective D7/D30 evidence refresh (same existing schedule)
        if: ${{ !cancelled() && steps.offline.outcome == 'success' }}
        run: python prospective_forecast.py refresh
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets['GOOGLE_SERVICE_ACCOUNT_JSON'] }}
          GOOGLE_SHEET_ID: ${{ secrets['GOOGLE_SHEET_ID'] }}
