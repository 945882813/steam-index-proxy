name: One-time PF Incremental No-op Acceptance 2026-10-20

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-pf-incremental-noop-20261020.yml'

permissions:
  contents: read

concurrency:
  group: steam-radar-daily-collection
  cancel-in-progress: false

jobs:
  verify-noop:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run offline contract tests
        run: python -m unittest discover -s tests -q
      - name: Snapshot production locked forecasts and posterior records (read only)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets['GOOGLE_SERVICE_ACCOUNT_JSON'] }}
          GOOGLE_SHEET_ID: ${{ secrets['GOOGLE_SHEET_ID'] }}
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from prospective_forecast import connect, read_sheets, sheets_rows
          book = connect()
          l, p = read_sheets(book)
          locks = sheets_rows(l)
          before = [l.get_all_values(), p.get_all_values()]
          assert len(locks) == 3 and len(before[1]) == 4
          assert all(r[6] == "WINDOW_NOT_MATURE" and r[11] == "WINDOW_NOT_MATURE"
                     for r in before[1][1:]), "D7/D30 changed unexpectedly"
          digest = hashlib.sha256(json.dumps(before, ensure_ascii=False).encode("utf-8")).hexdigest()
          Path("/tmp/pf-before-digest").write_text(digest)
          print("PROD_BEFORE count=3 D7=pending D30=pending; locked SHA integrity valid", flush=True)
          PY
      - name: Consecutive evidence-only refresh, no writes expected
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets['GOOGLE_SERVICE_ACCOUNT_JSON'] }}
          GOOGLE_SHEET_ID: ${{ secrets['GOOGLE_SHEET_ID'] }}
        run: |
          python prospective_forecast.py refresh
          python prospective_forecast.py refresh
      - name: Verify exact unchanged locked and derived rows (read only)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets['GOOGLE_SERVICE_ACCOUNT_JSON'] }}
          GOOGLE_SHEET_ID: ${{ secrets['GOOGLE_SHEET_ID'] }}
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from prospective_forecast import connect, read_sheets, sheets_rows
          book = connect()
          l, p = read_sheets(book)
          assert len(sheets_rows(l)) == 3
          after = [l.get_all_values(), p.get_all_values()]
          digest = hashlib.sha256(json.dumps(after, ensure_ascii=False).encode("utf-8")).hexdigest()
          assert digest == Path("/tmp/pf-before-digest").read_text(), "production row changed during no-op refresh"
          print("PROD_DOUBLE_NOOP_VERIFIED exact_locked_and_posterior_bytes_unchanged", flush=True)
          PY
