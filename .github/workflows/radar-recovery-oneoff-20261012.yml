name: Steam Radar - one-time 2026-10-12 recovery trigger
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/radar-recovery-oneoff-20261012.yml'
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch existing idempotent radar daily recovery
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api -X POST "repos/${GH_REPO}/actions/workflows/radar-v12.yml/dispatches" -f ref=main
          echo "Requested recovery on current main. Daily recovery preflight controls duplicated writes."
