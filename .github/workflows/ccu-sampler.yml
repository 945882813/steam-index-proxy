name: CCU Sampler

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run CCU sampler
        run: python ccu_sampler.py
        env:
          STEAM_INDEX_API_KEY: SET_IN_GITHUB_SECRETS
          GOOGLE_SERVICE_ACCOUNT_JSON: SET_IN_GITHUB_SECRETS
          GOOGLE_SHEET_ID: SET_IN_GITHUB_SECRETS
