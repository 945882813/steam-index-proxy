name: Steam Radar Watchdog

on:
  workflow_dispatch:
  schedule:
    # Avoid GitHub scheduling hot spots; Beijing fallback checks at 06:41
    # and 08:41 (within the 06:30-09:05 recovery window).
    - cron: '41 */2 * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: steam-radar-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Log schedule trigger and runner start
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          echo "trigger_event=$TRIGGER_EVENT"
          echo "trigger_cron=$TRIGGER_CRON"
          echo "runner_observed_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Backstop delayed or missing morning Steam collections
        run: python radar_morning_fallback.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify production GitHub workflow results (independent of Google Sheets)
        if: ${{ always() }}
        run: python github_run_health.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Detect stale data and active radar alerts
        if: ${{ always() }}
        run: python radar_v12.py health
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets['GOOGLE_SERVICE_ACCOUNT_JSON'] }}
          GOOGLE_SHEET_ID: ${{ secrets['GOOGLE_SHEET_ID'] }}
